name: ci

on:
  pull_request:
  push:
    branches: [main, stable]

permissions:
  contents: read

# A newer push to the same PR cancels the older run still in progress.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  engine:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      # fetch-depth 2: a PR checks out a merge commit; HEAD^1 is the base.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # A PR that changes only docs/ or top-level *.md files skips the
      # engine build and tests (they never read those files). The pipeline
      # and secrets jobs still run: they check the docs. Pushes to main and
      # stable always run everything.
      - id: scope
        working-directory: .
        run: |
          code=true
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            other=$(printf '%s\n' "$changed" | grep -vE '^docs/|^[^/]+\.md$' || true)
            if [ -n "$changed" ] && [ -z "$other" ]; then
              code=false
              echo "Docs-only PR: skipping the engine build and tests."
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - if: steps.scope.outputs.code == 'true'
        run: npm ci
      - if: steps.scope.outputs.code == 'true'
        run: npm run typecheck
      - if: steps.scope.outputs.code == 'true'
        run: npm run lint
      - if: steps.scope.outputs.code == 'true'
        run: npm test
      - if: steps.scope.outputs.code == 'true'
        run: npm run build

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pullers/requirements.txt
      - run: pip install -r pullers/requirements.txt pytest
      # knowledge_repo tests make real git commits in temp repos.
      - run: |
          git config --global user.email ci@example.com
          git config --global user.name ci
      # access_test.py is a live-database acceptance suite (it needs real
      # credentials); it runs from `kbe verify`, not in CI.
      - run: python -m pytest scripts pullers -q --ignore=scripts/knowledge/access_test.py
        env:
          PYTHONPATH: scripts:.
      # The public release (imagicrafter/quantabase) is this tree minus the
      # release tooling: it must pass the scrub check on every change, so no
      # private name can reach a release. Skipped where the tooling is absent
      # (the public repository itself).
      - name: the public release tree passes the scrub check
        if: hashFiles('scripts/release/scrub-patterns.txt') != ''
        run: python -m release.public --repo . --ref HEAD --out "$RUNNER_TEMP/qb-release"
        env:
          PYTHONPATH: scripts:.
      # Each job must start with nothing but pullers/requirements.txt and
      # this repository: no settings file, no code from anywhere else.
      - name: every puller starts from a clean checkout
        run: |
          python -m pullers.runner --help > /dev/null
          for source in wiki drive fireflies gmail; do
            python -c "import pullers.${source} as p; assert p.SOURCE == '${source}'"
          done
        env:
          PYTHONPATH: scripts:.

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --redact --no-banner
