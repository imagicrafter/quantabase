# No dashboard.knowledge: a worker may use the gauges the service builds from `sources`.
version: 1
engine:
  id: acme
  name: Acme's Knowledge Base Engine
  owner:
    email: owner@example.com
sources:
  wiki: { enabled: true, repo: acme/knowledge }
  drive: { enabled: true }
  fireflies: { enabled: true }
  gmail: { enabled: true }
dashboard:
  workers:
    - id: keeper
      label: Keeper
      uses: [knowledge.index, knowledge.documents, knowledge.meetings, knowledge.email]
